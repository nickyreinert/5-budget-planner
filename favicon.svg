<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a7fe0"/>
      <stop offset="100%" stop-color="#0052a3"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#g)"/>
  <circle cx="32" cy="32" r="30" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
  <!-- Currency-style "5": a bold numeral with two vertical bars struck
       through it, like ₩/₪ - the app's own "5" brand mark turned into a
       currency symbol. -->
  <text x="32" y="45" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle">5</text>
  <rect x="22" y="19" width="4" height="26" fill="#ffffff"/>
  <rect x="38" y="19" width="4" height="26" fill="#ffffff"/>
</svg>