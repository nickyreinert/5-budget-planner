<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a7fe0"/>
      <stop offset="100%" stop-color="#0052a3"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="64" height="64" fill="url(#g)"/>
  <!-- Kept inside the ~80% maskable safe zone so OS icon masks (circle,
       squircle, ...) don't clip the glyph. Blocky seven-segment-display "5"
       (straight bars only) with one vertical bar through it, like $. -->
  <rect x="20" y="16" width="24" height="5" fill="#ffffff"/>
  <rect x="20" y="21" width="5" height="7" fill="#ffffff"/>
  <rect x="20" y="28" width="24" height="5" fill="#ffffff"/>
  <rect x="39" y="33" width="5" height="8" fill="#ffffff"/>
  <rect x="20" y="41" width="24" height="5" fill="#ffffff"/>
  <rect x="30" y="12" width="4" height="40" fill="#ffffff"/>
</svg>